name: Build Universal TWRP 16 for gauguin (EXT4 + EROFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 1. Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: 2. Setup 24GB swap and install build dependencies
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 24G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo sysctl -w vm.swappiness=80
          sudo apt-get update
          sudo apt-get install -y git aria2 rsync curl zip unzip python-is-python3 cpio \
            bison build-essential flex libncurses5-dev libssl-dev libxml2-utils xz-utils \
            lz4 zstd bc
          sudo curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo

      - name: 3. Sync TWRP-Test 16.0 manifest
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          git config --global user.name "Builder"
          git config --global user.email "builder@example.com"
          repo init --depth=1 -u https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git -b twrp-16.0
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
          rm -rf ~/twrp/.repo

      - name: 4. Checkout device tree and fetch clean EROFS kernel
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: 4.5. Replace prebuilt Image with clean EROFS kernel
        run: |
          curl -fsSL "https://github.com/RustleMaples/android_kernel_xiaomi_gauguin/releases/download/twrp-kernel-erofs/Image-twrp" \
            -o "$GITHUB_WORKSPACE/device_tree/prebuilt/Image"
          ls -lh "$GITHUB_WORKSPACE/device_tree/prebuilt/Image"

      - name: 5. Build recoveryimage
        run: |
          mkdir -p ~/twrp/device/xiaomi
          cp -r "$GITHUB_WORKSPACE/device_tree" ~/twrp/device/xiaomi/gauguin
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL="C"
          export GOGC=50
          source build/envsetup.sh
          lunch twrp_gauguin-bp2a-eng
          mka -j3 recoveryimage
          python3 ~/twrp/external/avb/avbtool.py info_image --image ~/twrp/out/target/product/gauguin/recovery.img

      - name: 6. Upload & Release recovery.img
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-16-gauguin-erofs
          path: ~/twrp/out/target/product/gauguin/recovery.img

      - name: 7. Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="twrp-erofs-${{ github.run_number }}-${GITHUB_SHA::7}"
          gh release create "$TAG" ~/twrp/out/target/product/gauguin/recovery.img \
            --repo "${{ github.repository }}" \
            --title "TWRP 16 Universal EXT4+EROFS ($TAG)" \
            --notes "Built with clean 4.19.325 EROFS Image-twrp (non-KSU/KPM) and AVB signed." \
            --latest
